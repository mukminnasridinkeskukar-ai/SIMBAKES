<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Peserta - SIMBAKES Dinas Kesehatan</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --success-dark: #15803d;
            --warning: #d97706;
            --error: #dc2626;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1);
            --radius: 12px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.5s ease, padding 0.3s ease;
        }
        
        /* Body state saat profil aktif - FULL SCREEN */
        body.profile-active {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f0fdf4 100%);
            align-items: flex-start;
            padding: 0;
            display: block;
        }
        
        body.profile-active .container {
            max-width: 100%;
            width: 100%;
        }
        
        .container { width: 100%; max-width: 480px; }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 32px 24px;
            text-align: center;
            color: white;
        }
        
        .avatar {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
            border: 3px solid rgba(255,255,255,0.3);
        }
        
        .title { font-size: 1.5rem; font-weight: 700; }
        .subtitle { font-size: 0.875rem; opacity: 0.9; margin-top: 4px; }
        
        .body { padding: 28px 24px; }
        
        .form-group { margin-bottom: 20px; }
        
        .label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
        }
        
        .input-wrapper { position: relative; }
        
        .input-icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }
        
        .input {
            width: 100%; height: 48px;
            padding: 0 16px 0 44px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 0.9375rem;
            transition: all 0.2s;
        }
        
        .input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
        }
        
        .input.error { border-color: var(--error); }
        
        .error-msg {
            font-size: 0.75rem;
            color: var(--error);
            margin-top: 6px;
            display: none;
        }
        
        .error-msg.show { display: block; animation: shake 0.4s ease-out; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        
        .btn {
            width: 100%; height: 52px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; border: none;
            border-radius: var(--radius);
            font-size: 1rem; font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-top: 24px;
        }
        
        .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; }
        
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Profile Section - FULL WIDTH */
        .profile-section { 
            display: none; 
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f0fdf4 100%);
        }
        .profile-section.active { 
            display: block; 
            animation: fadeIn 0.4s ease-out; 
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .profile-header {
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            padding: 40px 32px;
            text-align: center;
            color: white;
        }
        
        .profile-avatar {
            width: 90px; height: 90px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-weight: 700;
            border: 4px solid rgba(255,255,255,0.4);
        }
        
        .profile-name { font-size: 1.375rem; font-weight: 700; }
        .profile-role {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            margin-top: 4px;
        }
        
        .profile-body { 
            padding: 32px; 
            max-width: 1440px;
            margin: 0 auto;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .info-item {
            background: var(--gray-50);
            padding: 14px;
            border-radius: 10px;
        }
        
        .info-label {
            font-size: 0.75rem;
            color: var(--gray-500);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .info-value {
            font-size: 0.9375rem;
            color: var(--gray-800);
            font-weight: 600;
            margin-top: 2px;
        }
        
        /* Submissions Cards */
        .submissions-section {
            background: var(--gray-50);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .submissions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .submissions-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--gray-800);
        }
        
        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        
        .badge.loading { background: #dbeafe; color: #1e40af; }
        .badge.found { background: #dcfce7; color: #166534; }
        .badge.error { background: #fee2e2; color: #991b1b; }
        .badge.empty { background: #f3f4f6; color: #4b5563; }
        
        .cards-grid { 
            display: grid; 
            gap: 24px; 
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Lightbox Card - FULL SCREEN */
        .lightbox-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.25);
            border: 1px solid var(--gray-200);
            animation: cardIn 0.6s ease-out both;
            width: 100%;
        }
        
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .lightbox-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }
        
        .card-inner {
            display: flex;
            min-height: 550px;
            width: 100%;
        }
        
        @media (max-width: 968px) {
            .card-inner { flex-direction: column-reverse; }
        }
        
        .card-data {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--gray-100);
        }
        
        .card-reg {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary);
        }
        
        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        
        .status-badge.approved { background: #dcfce7; color: #166534; }
        .status-badge.rejected { background: #fee2e2; color: #991b1b; }
        .status-badge.pending { background: #fef3c7; color: #92400e; }
        
        /* Data Sections - Grouping */
        .data-section {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--gray-200);
        }
        
        .data-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            padding-left: 8px;
            border-left: 3px solid var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .fields-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
        }
        
        @media (max-width: 480px) {
            .fields-grid { grid-template-columns: 1fr; }
        }
        
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field.full { grid-column: 1 / -1; }
        
        .field-label {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
        }
        
        .field-value {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-800);
            padding: 8px 10px;
            background: var(--gray-50);
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }
        
        .card-photo {
            width: 380px;
            min-height: 550px;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        
        .card-photo::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }
        
        @media (max-width: 968px) {
            .card-photo { width: 100%; min-height: 280px; }
        }
        
        .card-photo img {
            width: 100%; 
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .card-photo img:hover {
            transform: scale(1.05);
        }
        
        .photo-placeholder {
            text-align: center;
            color: var(--primary);
            position: relative;
            z-index: 1;
        }
        
        .photo-initial {
            width: 140px; height: 140px;
            background: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 4rem;
            font-weight: 800;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            margin: 0 auto 16px;
            border: 4px solid rgba(255,255,255,0.8);
        }
        
        .photo-text { 
            font-size: 1rem; 
            font-weight: 700; 
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .card-footer {
            padding: 12px 20px;
            background: var(--gray-50);
            border-top: 1px solid var(--gray-200);
            font-size: 0.75rem;
            color: var(--gray-500);
            display: flex;
            justify-content: space-between;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray-500);
        }
        
        .empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-text { font-size: 1rem; font-weight: 600; color: var(--gray-700); margin-bottom: 4px; }
        .empty-hint { font-size: 0.875rem; }
        
        .btn-logout {
            width: 100%; height: 48px;
            background: var(--gray-100);
            color: var(--gray-700);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }
        
        .btn-logout:hover {
            background: #fef2f2;
            border-color: #fecaca;
            color: var(--error);
        }
        
        .footer {
            padding: 20px 24px;
            background: var(--gray-50);
            text-align: center;
            border-top: 1px solid var(--gray-200);
        }
        
        .footer-text { font-size: 0.8125rem; color: var(--gray-500); margin-bottom: 8px; }
        
        .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            background: white;
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: var(--shadow-xl);
            display: flex; align-items: center; gap: 10px;
            min-width: 280px;
            max-width: 400px;
            animation: toastIn 0.3s ease-out;
            border-left: 4px solid;
        }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--error); }
        .toast.warning { border-left-color: var(--warning); }
        .toast.info { border-left-color: var(--primary); }
        
        .toast-icon { font-size: 1.125rem; }
        .toast-body { flex: 1; }
        .toast-title { font-weight: 700; font-size: 0.8125rem; }
        .toast-msg { font-size: 0.75rem; color: var(--gray-600); margin-top: 2px; }
        .toast-close { cursor: pointer; color: var(--gray-400); font-size: 1.125rem; }
        
        /* Debug Panel */
        .debug-panel {
            position: fixed;
            bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.95);
            color: #00ff00;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 11px;
            max-width: 450px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 99999;
            display: none;
        }
        
        .debug-panel.show { display: block; }
        .debug-line { margin: 3px 0; word-break: break-all; }
        .debug-error { color: #ff6b6b; }
        .debug-success { color: #51cf66; }
        .debug-info { color: #74c0fc; }
        
        /* Photo Lightbox Overlay */
        .photo-lightbox-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 20px;
        }
        
        .photo-lightbox-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .photo-lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        
        .photo-lightbox-overlay.active .photo-lightbox-content {
            transform: scale(1);
        }
        
        .photo-lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .photo-lightbox-close:hover {
            background: rgba(255,255,255,0.4);
            transform: rotate(90deg);
        }
        
        .photo-lightbox-content img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease 0.1s;
        }
        
        .photo-lightbox-content img.loaded {
            opacity: 1;
        }
        
        .photo-lightbox-caption {
            color: white;
            margin-top: 16px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Debug Panel -->
    <div class="debug-panel" id="debugPanel"></div>
    
    <div class="container">
        <div class="card">
            <!-- Login Header -->
            <div class="header">
                <div class="avatar">👤</div>
                <h1 class="title">Login Peserta</h1>
                <p class="subtitle">SIMBAKES Dinas Kesehatan</p>
            </div>
            
            <!-- Login Form -->
            <div class="body" id="loginBody">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="label">Username / Email</label>
                        <div class="input-wrapper">
                            <input type="text" class="input" id="username" placeholder="Masukkan username atau email" autocomplete="username">
                            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </div>
                        <div class="error-msg" id="usernameError">Username wajib diisi</div>
                    </div>
                    
                    <div class="form-group">
                        <label class="label">Password</label>
                        <div class="input-wrapper">
                            <input type="password" class="input" id="password" placeholder="Masukkan password" autocomplete="current-password">
                            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                        <div class="error-msg" id="passwordError">Password wajib diisi</div>
                    </div>
                    
                    <button type="submit" class="btn" id="submitBtn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
                        <span id="btnText">Masuk</span>
                    </button>
                </form>
                
                <p style="margin-top: 20px; text-align: center;">
                    <span class="footer-text">Belum punya akun?</span><br>
                    <a href="https://simbakes.mukminnasri.com/daftar-peserta.html" class="link" target="_blank">Daftar sebagai Peserta Baru →</a>
                </p>
            </div>
            
            <!-- Profile Section -->
            <div class="profile-section" id="profileSection">
                <div class="profile-header">
                    <div class="profile-avatar" id="profileAvatar">A</div>
                    <h2 class="profile-name" id="profileName">Nama User</h2>
                    <span class="profile-role" id="profileRole">Peserta</span>
                </div>
                
                <div class="profile-body">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">NIK</div>
                            <div class="info-value" id="infoNIK">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Email</div>
                            <div class="info-value" id="infoEmail">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Status</div>
                            <div class="info-value" id="infoStatus">Aktif</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Login Terakhir</div>

        ============================================================
        
        Form daftar peserta menggunakan:
        - Algorithm: SHA-256
        - Salt: 'simbakes_salt_2024'
        - Output: Hex string (64 karakter)
        
        Contoh hasil hash untuk password 'test123':
        Input: 'test123' + 'simbakes_salt_2024' = 'test123simbakes_salt_2024'
        Output SHA-256 hex: 'a1b2c3d4e5f6...'
        
        ============================================================
        */
        
        // Hash password menggunakan SHA-256 + salt (sama seperti form pendaftaran)
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const passwordData = encoder.encode(password + 'simbakes_salt_2024');
            const hashBuffer = await crypto.subtle.digest('SHA-256', passwordData);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        // Legacy simpleHash (untuk backward compatibility)
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
            }
            return Math.abs(hash).toString();
        }

                        </div>
                        <div class="card-footer">
                            <span>📅 Tanggal Pengajuan: ${date}</span>
                            <span>🆔 ID: ${sub.id?.substring(0, 12)}...</span>
                        </div>
                    </div>
                `;
            });
            
            el.cardsGrid.innerHTML = html;
        }
        
        // Photo Lightbox Function
        function openPhotoLightbox(src, name) {
            if (!src) return;
            
            // Create lightbox overlay
            const overlay = document.createElement('div');
            overlay.className = 'photo-lightbox-overlay';
            overlay.id = 'photoLightbox';
            overlay.onclick = (e) => {
                if (e.target === overlay) closePhotoLightbox();
            };
            
            overlay.innerHTML = `
                <div class="photo-lightbox-content">
                    <button class="photo-lightbox-close" onclick="closePhotoLightbox()" title="Tutup (ESC)">✕</button>
                    <img src="${src}" alt="Foto ${name}" onload="this.classList.add('loaded')">
                    <div class="photo-lightbox-caption">${name}</div>
                </div>
            `;
            
            document.body.appendChild(overlay);
            requestAnimationFrame(() => overlay.classList.add('active'));
            
            // ESC key to close
            document.addEventListener('keydown', function escHandler(e) {
                if (e.key === 'Escape') {
                    closePhotoLightbox();
                    document.removeEventListener('keydown', escHandler);
                }
            });
            
            // Prevent body scroll
            document.body.style.overflow = 'hidden';
        }
        
        function closePhotoLightbox() {
            const lightbox = document.getElementById('photoLightbox');
            if (lightbox) {
                lightbox.classList.remove('active');
                setTimeout(() => {
                    lightbox.remove();
                    document.body.style.overflow = '';
                }, 300);
            }
        }
        
        function renderEmpty() {
            el.cardsGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-text">Belum Ada Pengajuan</div>
                    <div class="empty-hint">Anda belum mengajukan beasiswa</div>
                </div>
            `;
        }
        
        function renderError(msg) {
            el.cardsGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-text">Gagal Memuat Data</div>
                    <div class="empty-hint">${escapeHtml(msg)}</div>
                </div>
            `;
            updateBadge('error', 'Error');
        }
        
        function updateBadge(type, text) {
            el.subBadge.className = `badge ${type}`;
            el.subBadge.textContent = text;
        }
        
        function getStatusClass(status) {
            if (!status) return 'pending';
            const s = status.toLowerCase();
            if (s.includes('setujui') || s.includes('approve') || s.includes('disetujui')) return 'approved';
            if (s.includes('tolak') || s.includes('reject') || s.includes('ditolak')) return 'rejected';
            return 'pending';
        }
        
        function formatDate(dateStr) {
            try {
                return new Date(dateStr).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });
            } catch {
                return dateStr || '-';
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ============================================================
        // FORM HANDLING
        // ============================================================
        
        function validate() {
            const username = el.username.value.trim();
            const password = el.password.value;
            let valid = true;
            
            el.username.classList.remove('error');
            el.password.classList.remove('error');
            el.usernameErr.classList.remove('show');
            el.passwordErr.classList.remove('show');
            
            if (!username) {
                el.username.classList.add('error');
                el.usernameErr.classList.add('show');
                valid = false;
            }
            
            if (!password) {
                el.password.classList.add('error');
                el.passwordErr.classList.add('show');
                valid = false;
            }
            
            return valid ? { username, password } : null;
        }
        
        function setLoading(isLoading) {
            el.submitBtn.disabled = isLoading;
            el.btnText.innerHTML = isLoading ? '<div class="spinner"></div> Memproses...' : 'Masuk';
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            
            const creds = validate();
            if (!creds) return;
            
            setLoading(true);
            
            try {
                log(`🔐 Login attempt: ${creds.username}`, 'info');
                
                const user = await authenticate(creds.username, creds.password);
                
                if (user) {
                    log(`✅ Login SUCCESS: ${user.nama_lengkap}`, 'success');
                    handleSuccess(user);
                } else {
                    log(`❌ Login FAILED: Invalid credentials`, 'error');
                    showToast('error', '❌ Login Gagal', 'Username atau password salah');
                    el.password.value = '';
                    el.password.focus();
                }
            } catch (err) {
                log(`❌ Login ERROR: ${err.message}`, 'error');
                showToast('error', '❌ Error', err.message);
            } finally {
                setLoading(false);
            }
        }
        
        function handleSuccess(user) {
            // Save session
            currentSession = {
                ...user,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem(CONFIG.sessionKey, JSON.stringify(currentSession));
            
            // Update UI
            showProfile(user);
            showToast('success', '✅ Login Berhasil', `Selamat datang, ${user.nama_lengkap}!`);
            
            // Fetch submissions
            fetchSubmissions(user).then(() => {
                log('📋 Submissions loaded', 'info');
            });
        }
        
        function showProfile(user) {
            const initial = (user.nama_lengkap || '?').charAt(0).toUpperCase();
            
            el.profileAvatar.textContent = initial;
            el.profileName.textContent = user.nama_lengkap;
            el.profileRole.textContent = user.isDemo ? 'Demo Mode' : (user.role || 'Peserta');
            el.infoNIK.textContent = user.nik || '-';
            el.infoEmail.textContent = user.email || '-';
            el.infoStatus.textContent = user.status === 'active' ? 'Aktif' : 'Tidak Aktif';
            el.infoLastLogin.textContent = 'Baru saja';
            
            el.loginBody.style.display = 'none';
            el.loginFooter.style.display = 'none';
            el.profileSection.classList.add('active');
            
            // Add full-screen class to body
            document.body.classList.add('profile-active');
        }
        
        function showLoginForm() {
            el.loginBody.style.display = 'block';
            el.loginFooter.style.display = 'block';
            el.profileSection.classList.remove('active');
            // Remove full-screen class from body
            document.body.classList.remove('profile-active');
        }
        
        function doLogout() {
            localStorage.removeItem(CONFIG.sessionKey);
            currentSession = null;
            
            // Remove full-screen class from body
            document.body.classList.remove('profile-active');
            
            el.username.value = '';
            el.password.value = '';
            showLoginForm();
            renderEmpty();
            updateBadge('loading', 'Memuat...');
            
            showToast('info', '👋 Logout', 'Anda telah keluar');
        }
        
        // ============================================================
        // SESSION CHECK
        // ============================================================
        
        function checkSession() {
            try {
                const saved = localStorage.getItem(CONFIG.sessionKey);
                if (!saved) return null;
                
                const session = JSON.parse(saved);
                
                // Check expiry (24 hours)
                const age = Date.now() - new Date(session.loginTime).getTime();
                if (age > 24 * 60 * 60 * 1000) {
                    localStorage.removeItem(CONFIG.sessionKey);
                    return null;
                }
                
                return session;
            } catch {
                return null;
            }
        }
        
        // ============================================================
        // INITIALIZATION
        // ============================================================
        
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 Initializing Login Peserta V3...', 'info');
            log(`📍 Supabase URL: ${CONFIG.supabaseUrl}`, 'info');
            log(`🔑 Key present: ${!!CONFIG.supabaseKey}`, 'info');
            log(`📦 Supabase lib: ${!!window.supabase}`, 'info');
            
            // Attach form handler
            el.form.addEventListener('submit', handleLogin);
            
            // Input focus effects
            el.username.addEventListener('focus', () => {
                el.username.classList.remove('error');
                el.usernameErr.classList.remove('show');
            });
            
            el.password.addEventListener('focus', () => {
                el.password.classList.remove('error');
                el.passwordErr.classList.remove('show');
            });
            
            // Check existing session
            const session = checkSession();
            if (session) {
                log(`♻️ Session found: ${session.nama}`, 'info');
                showProfile(session);
                showToast('info', '♻️ Welcome Back', `Selamat datang, ${session.nama_lengkap}!`);
                
                // Auto-fetch submissions
                fetchSubmissions(session);
            }
            
            log('✅ Initialization complete!', 'success');
        });
    </script>
    
    <!-- Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
