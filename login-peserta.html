<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Peserta - SIMBAKES Dinas Kesehatan</title>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-50: #eff6ff;
            --primary-100: #dbeafe;
            --primary-200: #bfdbfe;
            --primary-300: #93c5fd;
            --primary-400: #60a5fa;
            --primary-500: #3b82f6;
            --primary-600: #2563eb;
            --primary-700: #1d4ed8;
            --primary-800: #1e40af;
            
            --emerald-50: #ecfdf5;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --emerald-700: #047857;
            
            --violet-50: #f5f3ff;
            --violet-500: #8b5cf6;
            --violet-600: #7c3aed;
            
            --orange-500: #f97316;
            --orange-600: #ea580c;
            
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            
            --error-500: #ef4444;
            --error-600: #dc2626;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary-50) 0%, var(--violet-50) 50%, var(--emerald-50) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 15% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(139, 92, 246, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }
        
        .container { width: 100%; max-width: 450px; position: relative; z-index: 1; }
        
        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* Header */
        .login-header {
            background: linear-gradient(135deg, var(--primary-600) 0%, var(--violet-600) 100%);
            padding: 36px 28px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
        }
        
        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        
        .logo-icon svg { width: 42px; height: 42px; color: var(--primary-600); }
        
        .header-title {
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 1;
        }
        
        .header-subtitle {
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }
        
        /* Body */
        .login-body { padding: 32px 28px 28px; }
        
        .form-intro { text-align: center; margin-bottom: 28px; }
        .form-intro h2 { color: var(--gray-800); font-family: 'Poppins', sans-serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
        .form-intro p { color: var(--gray-500); font-size: 0.88rem; line-height: 1.5; }
        
        /* Alert */
        .alert-container { margin-bottom: 20px; }
        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.87rem;
            font-weight: 500;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: alertSlide 0.3s ease-out;
        }
        @keyframes alertSlide { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .alert.error { background: #fef2f2; color: var(--error-600); border: 1px solid #fecaca; }
        .alert.success { background: var(--emerald-50); color: var(--emerald-700); border: 1px solid #a7f3d0; }
        .alert.info { background: var(--primary-50); color: var(--primary-700); border: 1px solid var(--primary-200); }
        .alert.hidden { display: none; }
        .alert svg { flex-shrink: 0; width: 20px; height: 20px; margin-top: 1px; }
        
        /* Form */
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 0.87rem; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
        .form-label .required { color: var(--error-500); margin-left: 2px; }
        
        .input-wrapper { position: relative; }
        .form-input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.94rem;
            font-weight: 500;
            color: var(--gray-800);
            background: var(--gray-50);
            transition: all 0.25s ease;
            outline: none;
        }
        .form-input:hover { border-color: var(--primary-300); background: white; }
        .form-input:focus { border-color: var(--primary-500); background: white; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .form-input::placeholder { color: var(--gray-400); font-weight: 400; }
        .form-input.error { border-color: var(--error-500); background: #fef2f2; }
        
        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--gray-400);
            transition: color 0.25s ease;
            pointer-events: none;
        }
        .input-wrapper:focus-within .input-icon { color: var(--primary-500); }
        
        .error-message { display: none; color: var(--error-600); font-size: 0.8rem; margin-top: 4px; padding-left: 4px; }
        .error-message.show { display: block; }
        
        /* Button */
        .submit-btn {
            width: 100%;
            padding: 15px 28px;
            margin-top: 24px;
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-600) 50%, var(--violet-600) 100%);
            color: white !important;
            border: none;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(59, 130, 246, 0.45); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; }
        .submit-btn.loading span { visibility: hidden; }
        .submit-btn.loading::after {
            content: '';
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Footer */
        .login-footer {
            padding: 20px 28px 24px;
            background: var(--gray-50);
            border-top: 1px solid var(--gray-200);
            text-align: center;
        }
        .footer-text { color: var(--gray-600); font-size: 0.9rem; }
        .footer-link {
            color: var(--primary-600);
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
        }
        .footer-link:hover { color: var(--primary-700); border-bottom-color: var(--primary-400); }
        
        /* ============================================================
           PROFILE LIGHTBOX (FULL SCREEN)
           ============================================================ */
        .profile-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 99999;
            animation: overlayFadeIn 0.4s ease-out;
            overflow-y: auto;
        }
        .profile-overlay.hidden { display: none; }
        
        @keyframes overlayFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .profile-card {
            background: white;
            border-radius: 24px;
            max-width: 1100px;
            width: 100%;
            margin: auto;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            animation: cardSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        
        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* Profile Header */
        .profile-header {
            background: linear-gradient(135deg, var(--primary-600) 0%, var(--violet-600) 50%, var(--cyan-600) 100%);
            padding: 28px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .profile-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 80% 50%, rgba(255,255,255,0.1) 0%, transparent 60%);
        }
        .profile-title {
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .close-btn {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            position: relative;
            z-index: 1;
        }
        .close-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: rotate(90deg);
        }
        .close-btn svg { width: 22px; height: 22px; color: white; }
        
        /* Profile Content */
        .profile-content {
            display: grid;
            grid-template-columns: 1fr 340px;
            min-height: 500px;
        }
        
        /* Data Section */
        .data-section {
            padding: 28px 32px;
            overflow-y: auto;
            max-height: calc(100vh - 180px);
        }
        
        .data-group {
            margin-bottom: 24px;
            background: var(--gray-50);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--gray-200);
        }
        
        .group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--gray-200);
        }
        
        .group-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .group-icon svg { width: 20px; height: 20px; color: white; }
        
        .group-icon.identitas { background: linear-gradient(135deg, var(--cyan-500), var(--cyan-600)); }
        .group-icon.kontak { background: linear-gradient(135deg, var(--primary-500), var(--primary-600)); }
        .group-icon.pendidikan { background: linear-gradient(135deg, var(--violet-500), var(--violet-600)); }
        .group-icon.pekerjaan { background: linear-gradient(135deg, var(--orange-500), var(--orange-600)); }
        .group-icon.pengusulan { background: linear-gradient(135deg, var(--emerald-500), var(--emerald-600)); }
        .group-icon.dokumen { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .group-icon.status { background: linear-gradient(135deg, #ec4899, #db2777); }
        .group-icon.lainnya { background: linear-gradient(135deg, var(--gray-500), var(--gray-600)); }
        
        .group-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--gray-800);
        }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px dashed var(--gray-200);
        }
        .data-row:last-child { border-bottom: none; }
        
        .data-label {
            font-size: 0.87rem;
            color: var(--gray-500);
            font-weight: 500;
            min-width: 140px;
            flex-shrink: 0;
        }
        .data-value {
            font-size: 0.9rem;
            color: var(--gray-800);
            font-weight: 600;
            text-align: right;
            word-break: break-word;
        }
        .data-value.empty { color: var(--gray-400); font-style: italic; font-weight: 400; }
        
        /* Photo Section */
        .photo-section {
            background: linear-gradient(180deg, var(--violet-50) 0%, var(--primary-50) 100%);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--gray-200);
        }
        
        .photo-label {
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--gray-700);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .photo-container {
            width: 260px;
            height: 320px;
            border-radius: 20px;
            overflow: hidden;
            background: white;
            box-shadow: 
                0 20px 40px rgba(139, 92, 246, 0.2),
                0 0 0 1px rgba(139, 92, 246, 0.1);
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .photo-container:hover {
            transform: scale(1.02);
            box-shadow: 
                0 25px 50px rgba(139, 92, 246, 0.3),
                0 0 0 1px rgba(139, 92, 246, 0.2);
        }
        
        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }
        
        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gray-100), var(--gray-200));
            color: var(--gray-500);
        }
        .photo-placeholder svg { width: 64px; height: 64px; margin-bottom: 12px; opacity: 0.5; }
        .photo-placeholder span { font-size: 0.9rem; font-weight: 600; }
        
        .photo-hint {
            margin-top: 16px;
            font-size: 0.82rem;
            color: var(--gray-500);
            text-align: center;
        }
        
        /* Loading State */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99998;
            animation: fadeIn 0.3s ease-out;
        }
        .loading-overlay.hidden { display: none; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary-500);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gray-700);
            text-align: center;
            max-width: 300px;
        }
        
        .loading-subtext {
            font-size: 0.88rem;
            color: var(--gray-500);
            margin-top: 8px;
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .profile-content {
                grid-template-columns: 1fr;
            }
            .photo-section {
                border-left: none;
                border-top: 1px solid var(--gray-200);
                order: -1;
            }
            .photo-container {
                width: 200px;
                height: 250px;
            }
            .data-section { max-height: 400px; }
        }
        
        @media (max-width: 576px) {
            body { padding: 12px; }
            .login-header { padding: 28px 20px 24px; }
            .logo-icon { width: 70px; height: 70px; }
            .header-title { font-size: 1.2rem; }
            .login-body { padding: 24px 20px 20px; }
            .profile-header { padding: 20px; }
            .profile-title { font-size: 1.2rem; }
            .data-section { padding: 20px; }
            .data-group { padding: 16px; }
            .data-label { min-width: 120px; font-size: 0.83rem; }
            .data-value { font-size: 0.86rem; }
        }
    </style>
</head>
<body>
    <!-- LOGIN FORM -->
    <div class="container" id="loginContainer">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <h1 class="header-title">SIMBAKES</h1>
                <p class="header-subtitle">Login Peserta Beasiswa Kesehatan</p>
            </div>
            
            <div class="login-body">
                <div class="form-intro">
                    <h2>Selamat Datang!</h2>
                    <p>Masukkan username dan password Anda untuk melanjutkan</p>
                </div>
                
                <div class="alert-container" id="alertContainer"></div>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Username <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <input type="text" class="form-input" id="username" placeholder="Masukkan username" required autocomplete="username">
                        </div>
                        <div class="error-message" id="usernameError">Username wajib diisi</div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input type="password" class="form-input" id="password" placeholder="Masukkan password" required autocomplete="current-password">
                        </div>
                        <div class="error-message" id="passwordError">Password wajib diisi</div>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:22px;height:22px;">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        <span>MASUK</span>
                    </button>
                </form>
            </div>
            
            <div class="login-footer">
                <p class="footer-text">
                    Belum punya akun? 
                    <a href="./daftar-peserta.html" class="footer-link">Daftar di Sini →</a>
                </p>
            </div>
        </div>
    </div>

    <!-- LOADING OVERLAY -->
    <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Memuat data peserta...</div>
        <div class="loading-subtext" id="loadingSubtext">Mohon tunggu sebentar</div>
    </div>

    <!-- PROFILE LIGHTBOX -->
    <div class="profile-overlay hidden" id="profileOverlay">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:28px;height:28px;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    PROFIL PESERTA
                </div>
                <button class="close-btn" onclick="closeProfile()" title="Tutup (ESC)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            
            <div class="profile-content">
                <!-- DATA SECTION -->
                <div class="data-section" id="dataSection">
                    <!-- Data akan di-render dinamis -->
                </div>
                
                <!-- PHOTO SECTION -->
                <div class="photo-section">
                    <div class="photo-label">Foto Peserta</div>
                    <div class="photo-container" id="photoContainer" onclick="enlargePhoto()">

        function formatValue(value, field) {

                return value ? '<span style="color: var(--emerald-600);">✓ Ya</span>' : '<span style="color: var(--gray-400);">✗ Tidak</span>';
            }
            
            // Date formatting
            if (field.includes('tanggal') || field.includes('_at') || field.includes('created') || field.includes('updated')) {
                try {
                    const date = new Date(value);
                    if (!isNaN(date.getTime())) {
                        return date.toLocaleDateString('id-ID', { 
                            day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' 
                        });
                    }
                } catch (e) {}
            }
            
            // URL/Link detection
            if (typeof value === 'string' && (value.startsWith('http') || value.startsWith('/'))) {
                if (field.includes('foto') || field.includes('file')) {
                    return `<a href="${value}" target="_blank" style="color: var(--primary-600); text-decoration: underline;">Lihat File →</a>`;
                }
            }
            
            // Default: escape HTML and return
            const str = String(value).replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return str;

        // ============================================================
        // PHOTO URL RESOLUTION (Supabase Storage Support)
        // ============================================================
        
        // Nama bucket yang umum digunakan - akan dicoba secara berurutan
        const STORAGE_BUCKETS = ['uploads', 'photos', 'submissions', 'fotos', 'images', 'public', 'files'];
        
        /**
         * Extract Google Drive File ID dari berbagai format URL
         */
        function extractGoogleDriveFileId(url) {
            const patterns = [
                /\/file\/d\/([a-zA-Z0-9_-]+)/,           // /file/d/FILE_ID
                /[?&]id=([a-zA-Z0-9_-]+)/,                 // ?id=FILE_ID or &id=FILE_ID
                /\/d\/([a-zA-Z0-9_-]+)/,                   // /d/FILE_ID
                /^([a-zA-Z0-9_-]{28,})$/                    // Just FILE_ID (28+ chars)
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match && match[1]) {
                    return match[1];
                }
            }
            return null;
        }

        /**
         * Konversi Google Drive sharing link ke direct image URL
         */
        function convertGoogleDriveToDirectUrl(url) {
            const fileId = extractGoogleDriveFileId(url);
            if (!fileId) return null;
            
            console.log(`[PHOTO] 🔄 Google Drive File ID extracted: ${fileId}`);
            
            // Format direct URL (paling reliable untuk <img>)
            const directUrls = [
                `https://lh3.googleusercontent.com/d/${fileId}`,      // Thumbnail (cepat)
                `https://drive.google.com/thumbnail?id=${fileId}`,    // Thumbnail resmi
                `https://drive.google.com/uc?export=view&id=${fileId}`, // Direct view
            ];
            
            return { fileId, directUrls };
        }

        /**
         * Cek apakah URL adalah Google Drive link
         */
        function isGoogleDriveUrl(url) {
            return url.includes('drive.google.com') || 
                   url.includes('google.com/file') ||
                   url.includes('google.com/open') ||
                   (url.length > 25 && /^[a-zA-Z0-9_-]{28,}$/.test(url));
        }

        /**
         * Resolve foto URL dari berbagai format:
         * 1. Google Drive Link → konversi ke direct image URL ⭐ NEW
         * 2. Full URL (http/https) → langsung digunakan
         * 3. Data URI (base64) → langsung digunakan  
         * 4. Supabase Storage path → dikonversi ke public URL
         * 5. Relative path → dicoba dengan storage buckets
         */
        async function resolvePhotoUrl(photoValue) {
            if (!photoValue || (typeof photoValue === 'string' && photoValue.trim() === '')) {
                return null;
            }
            
            const trimmedValue = String(photoValue).trim();
            
            // Case 1: Google Drive Link → Konversi ke Direct Image URL ⭐
            if (isGoogleDriveUrl(trimmedValue)) {
                console.log('[PHOTO] 🔗 Detected Google Drive URL, converting...');
                const driveData = convertGoogleDriveToDirectUrl(trimmedValue);
                
                if (driveData) {
                    // Return first direct URL (thumbnail - paling cepat dan reliable)
                    console.log(`[PHOTO] ✅ Converted to: ${driveData.directUrls[0]}`);
                    return driveData.directUrls[0];
                }
            }
            
            // Case 2: Sudah full URL (http/https) - bukan Google Drive
            if (trimmedValue.startsWith('http://') || trimmedValue.startsWith('https://')) {
                console.log('[PHOTO] ✅ Detected full URL (non-Google Drive)');
                return trimmedValue;
            }
            
            // Case 3: Data URI (base64)
            if (trimmedValue.startsWith('data:image/')) {
                console.log('[PHOTO] ✅ Detected data URI');
                return trimmedValue;
            }
            
            // Case 4 & 5: Coba resolve via Supabase Storage
            if (supabaseClient) {
                // Path yang mungkin (dengan atau tanpa prefix folder)
                const possiblePaths = [
                    trimmedValue,
                    trimmedValue.startsWith('uploads/') ? trimmedValue : `uploads/${trimmedValue}`,
                    trimmedValue.startsWith('fotos/') ? trimmedValue : `fotos/${trimmedValue}`,
                    trimmedValue.startsWith('photos/') ? trimmedValue : `photos/${trimmedValue}`,
                ];
                
                // Remove duplicate paths
                const uniquePaths = [...new Set(possiblePaths)];
                
                console.log('[PHOTO] 🔄 Attempting to resolve storage path:', trimmedValue);
                
                // Coba setiap kombinasi bucket + path
                for (const bucket of STORAGE_BUCKETS) {
                    for (const path of uniquePaths) {
                        try {
                            const { data } = supabaseClient.storage.from(bucket).getPublicUrl(path);
                            if (data && data.publicUrl) {
                                console.log(`[PHOTO] ✅ Resolved via bucket '${bucket}':`, data.publicUrl);
                                return data.publicUrl;
                            }
                        } catch (e) {
                            // Continue trying next combination
                        }
                    }
                }
                
                // Fallback: Coba dengan format URL langsung Supabase
                const fallbackUrl = `${SUPABASE_URL}/storage/v1/object/public/uploads/${trimmedValue}`;
                console.log('[PHOTO] ⚠️ Using fallback URL format:', fallbackUrl);
                return fallbackUrl;
            }
            
            // Jika tidak ada supabase client, kembalikan nilai asli
            console.log('[PHOTO] ⚠️ No Supabase client, returning raw value');
            return trimmedValue;
        }
        
        /**
         * Test jika URL valid dan bisa diakses
         */
        async function testImageUrl(url) {
            return new Promise((resolve) => {
                if (!url) { resolve(false); return; }
                
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
                
                // Timeout setelah 5 detik
                setTimeout(() => resolve(false), 5000);
            });
        }

                // Simpan semua URL alternatif (untuk Google Drive)
                let alternativeUrls = [];

                        alternativeUrls = driveData.directUrls.filter(url => url !== resolvedUrl);

                        alternativeUrls.push(photoValue);

                } else {
                    alternativeUrls.push(resolvedUrl); // Fallback: URL yang sama

                console.log('[PHOTO] Rendering with URL:', resolvedUrl);

                // Render foto dengan error handling yang lebih baik
                photoContainer.innerHTML = `

                            </svg>
                            <span>FOTO GAGAL DIMUAT</span>
                            <div style="margin-top: 12px;">
                                <p style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px;">Coba buka link secara manual:</p>
                                ${buttonsHtml}
                            </div>
                        </div>
                    `;
                };
                
            } catch (error) {
                console.error('[PHOTO] Error rendering photo:', error);
                renderPhotoPlaceholder(photoContainer);
            }
        }
        
        /**
         * Render placeholder ketika foto tidak tersedia
         */
        function renderPhotoPlaceholder(container) {
            container.innerHTML = `
                <div class="photo-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span>FOTO TIDAK TERSEDIA</span>
                </div>
            `;
        }
        
        function enlargePhoto() {
            const img = document.querySelector('.photo-img');
            if (img && img.src) {
                window.open(img.src, '_blank');
            }
        }

        // ============================================================
        // PROFILE OVERLAY CONTROL
        // ============================================================
        function showProfile() {
            document.getElementById('profileOverlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        
        function closeProfile() {
            document.getElementById('profileOverlay').classList.add('hidden');
            document.body.style.overflow = '';
        }
        
        // Close on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeProfile();
        });
        
        // Close on overlay click
        document.getElementById('profileOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'profileOverlay') closeProfile();
        });

        // ============================================================
        // MAIN LOGIN HANDLER
        // ============================================================
        async function handleLogin(event) {
            event.preventDefault();
            
            clearErrors();
            clearAlert();
            
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            
            // Validasi
            if (!username) { showError('username', 'Username wajib diisi'); return; }
            if (!password) { showError('password', 'Password wajib diisi'); return; }
            
            // Disable button
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            
            showAlert('⏳ Memproses login...', 'info');
            
            try {
                if (!supabaseClient) throw new Error('Koneksi database tidak tersedia.');
                
                console.log('[LOGIN] Authenticating user:', username);
                
                // Query ke tabel akun_peserta
                const { data: users, error: queryError } = await supabaseClient
                    .from('akun_peserta')
                    .select('*')
                    .or(`username.eq.${username},email.eq.${username}`)
                    .limit(1);
                
                if (queryError) throw new Error(queryError.message);
                
                console.log('[LOGIN] Query result:', users?.length ? 'User found' : 'Not found');
                
                // Cek user ditemukan
                if (!users || users.length === 0) {
                    throw new Error('Username atau password tidak sesuai.');
                }
                
                const user = users[0];
                
                // Verifikasi password (plaintext comparison sesuai permintaan)
                if (user.password !== password) {
                    console.log('[LOGIN] Password mismatch');
                    throw new Error('Username atau password tidak sesuai.');
                }
                
                // ⭐ CEK STATUS PERSETUJUAN ADMIN
                const userStatus = user.status || 'pending';  // Default pending jika null
                console.log('[LOGIN] User status:', userStatus);
                
                if (userStatus !== 'approved') {
                    let statusMessage = '';
                    
                    switch (userStatus) {
                        case 'pending':
                            statusMessage = `Akun Anda masih <strong>MENUNGGU PERSETUJUAN</strong> dari admin Dinkes.<br><br>
                                            Silakan tunggu 1-2 hari kerja untuk verifikasi.<br>
                                            Jika sudah lewat dari waktu tersebut, hubungi admin Dinas Kesehatan.`;
                            break;
                        case 'rejected':
                            statusMessage = `Akun Anda <strong>DITOLAK</strong> oleh admin Dinkes.<br><br>
                                            Alasan: ${user.status_note || 'Tidak ada catatan'}<br><br>
                                            Silakan hubungi admin untuk informasi lebih lanjut.`;
                            break;
                        case 'suspended':
                            statusMessage = `Akun Anda <strong>DITANGGUHKAN</strong> sementara.<br><br>
                                            Alasan: ${user.status_note || 'Tidak ada catatan'}<br><br>
                                            Hubungi admin Dinas Kesehatan untuk reaktivasi akun.`;
                            break;
                        default:
                            statusMessage = `Akun Anda dalam status <strong>${userStatus.toUpperCase()}</strong>.<br><br>
                                            Hubungi admin Dinas Kesehatan untuk informasi lebih lanjut.`;
                    }
                    
                    // Tampilkan pesan status yang jelas
                    const statusAlertDiv = document.createElement('div');
                    statusAlertDiv.className = 'alert status-warning';
                    statusAlertDiv.style.cssText = `
                        background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
                        border-left: 5px solid #f59e0b;
                        padding: 20px;
                        border-radius: 12px;
                        margin: 20px 0;
                        text-align: left;
                    `;
                    statusAlertDiv.innerHTML = `
                        <div style="display: flex; align-items: center; margin-bottom: 12px;">
                            <span style="font-size: 24px; margin-right: 10px;">⏳</span>
                            <span style="font-weight: 700; color: #92400e; font-size: 1rem;">STATUS AKUN: ${userStatus.toUpperCase()}</span>
                        </div>
                        <div style="color: #a16207; font-size: 0.9rem; line-height: 1.6;">
                            ${statusMessage}
                        </div>
                        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #fcd34d;">
                            <p style="margin: 0; color: #92400e; font-size: 0.8rem;">
                                📞 Hubungi Admin Dinkes jika ada pertanyaan
                            </p>
                        </div>
                    `;
                    
                    // Ganti alert container dengan pesan status
                    document.getElementById('alertContainer').innerHTML = '';
                    document.getElementById('alertContainer').appendChild(statusAlertDiv);
                    
                    // Reset button dan stop login
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('loading');
                    document.getElementById('password').value = '';
                    return;  // STOP - tidak lanjut ke login
                }
                
                console.log('[LOGIN] ✅ Authentication successful & Account Approved!');
                console.log('[LOGIN] User NIK:', user.nik);
                
                // Update last login (optional)
                await supabaseClient
                    .from('akun_peserta')
                    .update({ last_login_at: new Date().toISOString() })
                    .eq('id', user.id);
                
                // Ambil data dari submissions berdasarkan NIK
                showLoading(
                    'Mengambil data peserta...',
                    `Mencari data dengan NIK: ${user.nik}`
                );
                
                const { data: submissions, error: submissionError } = await supabaseClient
                    .from('submissions')
                    .select('*')
                    .eq('nik', user.nik)
                    .maybeSingle(); // Handle multiple or single results
                
                if (submissionError) {
                    console.error('[LOGIN] Submission query error:', submissionError);
                    // Tetap tampilkan user info meski submissions error
                    renderProfileData(user);
                    renderPhoto({});
                    showProfile();
                    hideLoading();
                    showAlert('⚠️ Login berhasil, tetapi data submissions bermasalah.', 'info');
                    return;
                }
                
                hideLoading();
                
                if (!submissions) {
                    // User login berhasil tapi tidak ada data di submissions
                    showAlert('✅ Login berhasil! Menampilkan data akun...', 'success');
                    renderProfileData(user);
                    renderPhoto({});
                    showProfile();
                    return;
                }
                
                console.log('[LOGIN] ✅ Submissions found:', Object.keys(submissions).length, 'fields');
                
                // Render profil lengkap
                showAlert('✅ Login berhasil!', 'success');
                renderProfileData(submissions);
                renderPhoto(submissions);
                showProfile();
                
            } catch (error) {
                console.error('[LOGIN] Error:', error);
                
                let errorMsg = error.message || 'Terjadi kesalahan.';
                
                if (errorMsg.includes('401') || errorMsg.includes('authentication')) {
                    errorMsg = 'Error autentikasi database.';
                } else if (errorMsg.includes('403') || errorMsg.includes('permission')) {
                    errorMsg = 'Error izin akses database.';
                } else if (errorMsg.includes('network') || errorMsg.includes('fetch')) {
                    errorMsg = 'Gagal terhubung ke server. Periksa koneksi internet.';
                }
                
                showAlert(`❌ ${errorMsg}`, 'error');
                
                // Reset button
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[LOGIN] Page loaded successfully');
            
            // Focus username field
            setTimeout(() => {
                document.getElementById('username')?.focus();
            }, 500);
            
            // Check for recent registration
            const recentReg = localStorage.getItem('simbakes_registration');
            if (recentReg) {
                const reg = JSON.parse(recentReg);
                if (Date.now() - reg.timestamp < 300000) { // Within 5 minutes
                    showAlert(`👋 Selamat datang, ${reg.nama}! Silakan login dengan akun yang baru dibuat.`, 'info');
                }
                localStorage.removeItem('simbakes_registration');
            }
        });
    </script>
</body>
</html>
