<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMBAKES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; z-index: 9999;">
        <div class="spinner"></div>
        <p>Memeriksa sesi...</p>
    </div>

    <!-- Login Container -->
    <div class="login-container" style="width: 100%; max-width: 440px; background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; animation: slideUp 0.5s ease-out;">
        
        <!-- Header -->
        <div class="login-header" style="background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color: white; padding: 40px 30px; text-align: center; position: relative; overflow: hidden;">
            <div style="position: absolute; top: -50%; right: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); animation: pulse 4s ease-in-out infinite;"></div>
            <div style="position: relative; z-index: 1; margin-bottom: 15px;">
                <div style="width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 36px; backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.3);">
                    <i class="fas fa-user-md"></i>
                </div>
            </div>
            <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 8px; position: relative; z-index: 1;">SIMBAKES</h1>
            <p style="font-size: 14px; opacity: 0.9; position: relative; z-index: 1;">Sistem Manajemen Beasiswa Kesehatan</p>
        </div>

        <!-- Alert Container -->
        <div id="alertContainer" style="padding: 0 30px; margin-top: 20px;"></div>

        <!-- Login Form -->
        <div style="padding: 35px 30px;">
            <form id="loginForm" novalidate>
                <!-- Email Field -->
                <div class="form-group" id="emailGroup">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" class="form-control" placeholder="Masukkan email anda" autocomplete="email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="error-message" id="emailError" style="display: none;"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>

                <!-- Password Field -->
                <div class="form-group" id="passwordGroup">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password" autocomplete="current-password" required>
                        <i class="fas fa-lock"></i>
                        <button type="button" onclick="togglePassword()" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-secondary); background: none; border: none; padding: 5px;">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="error-message" id="passwordError" style="display: none;"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>

                <!-- Options -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 14px;" class="form-options">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-secondary);">
                        <input type="checkbox" id="rememberMe" style="width: 18px; height: 18px; accent-color: var(--primary-color);">
                        <span>Ingat saya</span>
                    </label>
                    <a href="#" onclick="event.preventDefault(); alert('Fitur reset password akan segera tersedia.\n\nHubungi administrator untuk reset password manual.');" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Lupa password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn" style="padding: 15px;">
                    <i class="fas fa-sign-in-alt"></i><span>Masuk</span>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div style="text-align: center; padding: 20px 30px; background: var(--bg-main); border-top: 1px solid var(--border-color); font-size: 13px; color: var(--text-secondary);">
            <p>&copy; 2025 SIMBAKES - Beasiswa Tematik Bidang Kesehatan</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase-config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/utils.js"></script>
    
    <script>
        // ============================================================
        // Login Page Script (using shared auth module)
        // ============================================================

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');

        document.addEventListener('DOMContentLoaded', async () => {
            showLoading(true);
            
            try {
                // Initialize auth module
                await simbakesAuth.init();
                
                // Check if already logged in
                if (simbakesAuth.isAuthenticated()) {
                    console.log('User already authenticated, redirecting...');
                    simbakesAuth.redirectToDashboard();
                    return;
                }
            } catch (error) {
                console.error('Auth init error:', error);
            }
            
            showLoading(false);

            // Setup form submission
            loginForm.addEventListener('submit', handleLogin);
        });

        /**
         * Handle login form submission
         */
        async function handleLogin(e) {
            e.preventDefault();
            
            UI.clearAlerts('alertContainer');
            
            // Validate
            const emailValidation = Validate.required(emailInput.value, 'Email');
            if (!emailValidation.valid) {
                showFieldError('email', emailValidation.message);
                return;
            }
            
            const emailFormatValidation = Validate.email(emailInput.value);
            if (!emailFormatValidation.valid) {
                showFieldError('email', emailFormatValidation.message);
                return;
            }

            const passwordValidation = Validate.required(passwordInput.value, 'Password');
            if (!passwordValidation.valid) {
                showFieldError('password', passwordValidation.message);
                return;
            }

            const minLengthValidation = Validate.minLength(passwordInput.value, 6, 'Password');
            if (!minLengthValidation.valid) {
                showFieldError('password', minLengthValidation.message);
                return;
            }

            // Show loading state
            setLoginLoading(true);

            try {
                await simbakesAuth.login(emailInput.value.trim(), passwordInput.value);
                
                UI.showAlert('success', 'Login berhasil! Mengalihkan...', 'alertContainer');
                
                setTimeout(() => {
                    simbakesAuth.redirectToDashboard();
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = 'Terjadi kesalahan saat login';
                
                if (error.message?.includes('Invalid login credentials')) {
                    errorMessage = 'Email atau password salah';
                } else if (error.message?.includes('Email not confirmed')) {
                    errorMessage = 'Email belum diverifikasi. Silakan cek inbox Anda';
                } else if (error.message?.includes('diblokir')) {
                    errorMessage = error.message;
                } else if (error.message?.includes('tidak aktif')) {
                    errorMessage = error.message;
                }

                UI.showAlert('error', errorMessage, 'alertContainer');
                setLoginLoading(false);
            }
        }

        /**
         * Toggle password visibility
         */
        function togglePassword() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            
            const icon = document.getElementById('toggleIcon');
            icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        }

        function showFieldError(fieldId, message) {
            const group = document.getElementById(fieldId + 'Group');
            const errorDiv = document.getElementById(fieldId + 'Error');
            const span = errorDiv.querySelector('span');
            
            group.classList.add('error');
            span.textContent = message;
            errorDiv.style.display = 'flex';
        }

        function setLoginLoading(loading) {
            loginBtn.disabled = loading;
            
            if (loading) {
                loginBtn.innerHTML = '<div class="spinner"></div><span>Memproses...</span>';
            } else {
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Masuk</span>';
            }
        }

        function showLoading(show) {
            loadingOverlay.style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
